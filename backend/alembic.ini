# A generic, single database configuration.

[alembic]
# path to migration script directory
script_location = alembic

# sys.path path, inserted to sys.path if present
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

sqlalchemy.url = postgresql://user:password@localhost:5432/sahayak_db

[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
